# Jarvis "lite" — keeps Jarvis working while your PC is off.
# Runs every 5 minutes (GitHub may start it a few minutes late when busy).
name: jarvis
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}          # "Run workflow" button for testing

concurrency:
  group: jarvis
  cancel-in-progress: false

permissions:
  contents: write                # only for the monthly keep-alive commit below

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Asia/Kolkata
      JARVIS_ROLE: lite
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      DATA_REPO: ${{ secrets.DATA_REPO }}
      PAGES_URL: ${{ secrets.PAGES_URL }}
      USER_NAME: ${{ secrets.USER_NAME }}
      CITY: ${{ secrets.CITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lite.txt
      - run: pip install -r requirements-lite.txt
      - run: python jarvis_lite.py
      # GitHub pauses schedules in repos with no commits for 60 days — prevent that.
      - name: keep-alive
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 3456000 ]; then
            git config user.name "jarvis-bot"
            git config user.email "jarvis-bot@users.noreply.github.com"
            date -u > .keepalive && git add .keepalive && git commit -m "keep-alive" && git push
          fi
